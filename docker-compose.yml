services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: jawebni/app
    ports:
      - "8000:80"
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      APP_KEY: ${APP_KEY:-}
      APP_URL: http://localhost:8000
      DB_CONNECTION: sqlite
      DB_DATABASE: /var/www/html/database/database.sqlite
      QUEUE_CONNECTION: database
      CACHE_STORE: database
      SESSION_DRIVER: database
      AI_PROVIDER: ${AI_PROVIDER:-openai}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      WHATSAPP_ACCESS_TOKEN: ${WHATSAPP_ACCESS_TOKEN:-}
      WHATSAPP_PHONE_NUMBER_ID: ${WHATSAPP_PHONE_NUMBER_ID:-}
      WHATSAPP_VERIFY_TOKEN: ${WHATSAPP_VERIFY_TOKEN:-jawebni_webhook_secret_2026}
      WHATSAPP_APP_SECRET: ${WHATSAPP_APP_SECRET:-}
      RUN_MIGRATIONS: "true"
    volumes:
      - jawebni-storage:/var/www/html/storage
      - jawebni-database:/var/www/html/database
    restart: unless-stopped

  worker:
    image: jawebni/app
    command: php artisan queue:work --tries=3 --timeout=120 --sleep=3
    depends_on:
      - app
    environment:
      APP_ENV: production
      APP_KEY: ${APP_KEY:-}
      DB_CONNECTION: sqlite
      DB_DATABASE: /var/www/html/database/database.sqlite
      QUEUE_CONNECTION: database
      CACHE_STORE: database
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      WHATSAPP_ACCESS_TOKEN: ${WHATSAPP_ACCESS_TOKEN:-}
      WHATSAPP_PHONE_NUMBER_ID: ${WHATSAPP_PHONE_NUMBER_ID:-}
      RUN_MIGRATIONS: "false"
    volumes:
      - jawebni-storage:/var/www/html/storage
      - jawebni-database:/var/www/html/database
    restart: unless-stopped

  scheduler:
    image: jawebni/app
    command: php artisan schedule:work
    depends_on:
      - app
    environment:
      APP_ENV: production
      APP_KEY: ${APP_KEY:-}
      DB_CONNECTION: sqlite
      DB_DATABASE: /var/www/html/database/database.sqlite
      QUEUE_CONNECTION: database
      CACHE_STORE: database
      RUN_MIGRATIONS: "false"
    volumes:
      - jawebni-storage:/var/www/html/storage
      - jawebni-database:/var/www/html/database
    restart: unless-stopped

volumes:
  jawebni-storage:
  jawebni-database:
