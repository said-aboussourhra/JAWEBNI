; PHP directives merged into the vercel-php runtime configuration.
memory_limit = 1024M
max_execution_time = 60
max_input_vars = 3000
upload_max_filesize = 25M
post_max_size = 30M
date.timezone = Africa/Casablanca
display_errors = Off
log_errors = On
error_log = /tmp/php-error.log
opcache.enable = 1
opcache.validate_timestamps = 0
